<!DOCTYPE html>

  <!--
    Everything between the two TM:HEAD markers is rewritten per route by
    scripts/postbuild.mjs, so that a shared URL carries correct metadata
    even for a crawler that never runs the JavaScript. What is here is
    the Czech home page, which is also what `vite dev` serves.
  -->
  <!-- TM:HEAD:START -->
  <meta name="tm-route" content="home:cs">
  <title>Osobní trenér v Praze | Kryštof Švec · Tanmay Practice</title>
  <meta name="description" content="Osobní trénink v Praze pro sílu, pohybovou jistotu a praxi, která drží. Individuálně, v menší skupině nebo online. Jednorázově i dlouhodobě.">
  <link rel="canonical" href="https://tanmaypractice.com/">
  <!-- TM:HEAD:END -->

  <meta name="theme-color" content="#F4F0EB">
  <meta name="color-scheme" content="light">

  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <!--
    Písma podle type spec V2, hostovaná z vlastní domény:
      Cormorant Garamond  · anglický editorial display a wordmark
      EB Garamond         · český editorial display
      DM Sans             · text, rozhraní, funkce
      Barlow Condensed    · metadata a struktura
    Caveat je odstraněný. Rukopis se nesimuluje písmem.
    Soubory a licence: public/fonts/, generuje scripts/build-fonts.mjs.
    V produkci postbuild tenhle odkaz nahradí vloženým stylem.
  -->
  <!-- TM:FONTS -->
  <link rel="stylesheet" href="/fonts/tanmay-fonts.css">
</head>

        <a href="mailto:tanmay.in.flow@gmail.com" style="color:#B87333">tanmay.in.flow@gmail.com</a>.</p>
    </div>

  <script type="module" src="/src/main.tsx"></script>
